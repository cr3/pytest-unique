[project]
name = "pytest-unique"
dynamic = ["version"]
description = "Pytest fixture to generate unique values."
authors = [
    {name = "Marc Tardif", email = "marc@interunion.ca"},
]
readme = "README.rst"
repository = "https://github.com/cr3/pytest-unique"
requires-python = ">=3.10,<4.0"
dependencies = [
    "attrs>=25.3.0",
    "pytest>=9.0.0",
]

[project.optional-dependencies]

test = [
    "coverage>=7.3.1,<8.0.0",
    "pyhamcrest>=2.0.4,<3.0.0",
]

check = [
    "ruff>=0.0.289,<1.0.0",
]

docs = [
    "sphinx>=7.2.6,<8.0.0",
    "sphinxcontrib-log-cabinet>=1.0.1,<2.0.0",
    "sphinx-rtd-theme>=1.3.0,<2.0.0",
]

[project.entry-points."pytest11"]
unique = "pytest_unique.fixtures"

[project.entry-points."pytest_unique"]
bytes = "pytest_unique.unique:unique_bytes"
digits = "pytest_unique.unique:unique_digits"
email = "pytest_unique.unique:unique_email"
float = "pytest_unique.unique:unique_float"
integer = "pytest_unique.unique:unique_integer"
password = "pytest_unique.unique:unique_password"
text = "pytest_unique.unique:unique_text"
uuid = "pytest_unique.unique:unique_uuid"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
target-version = "py310"
line-length = 80
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
lint.ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Create your own exception
    "TRY002",
    # Avoid specifying long messages outside the exception class
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# Pytest options:
#   https://docs.pytest.org/en/6.2.x/reference.html#ini-options-ref
[tool.pytest.ini_options]
addopts = [
    "--doctest-modules",
    "--doctest-glob=*.rst",
]
testpaths = [
    "pytest_unique",
    "docs",
    "tests",
]

# Coverage options:
#   https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.paths]
source = [
    "pytest_unique",
    "*/*/site-packages",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.run]
branch = true
parallel = true
source = [
    "pytest_unique",
]
